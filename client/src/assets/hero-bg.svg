<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0c234a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#070d1e" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="1"/>
    </radialGradient>

    <!-- Node Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="streamBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c87eb" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0c87eb" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="1440" height="720" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Matrix (Subtle) -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1440" y2="120"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>

    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
    <line x1="960" y1="0" x2="960" y2="720"/>
    <line x1="1120" y1="0" x2="1120" y2="720"/>
    <line x1="1280" y1="0" x2="1280" y2="720"/>
  </g>

  <!-- Flowing Queue Trajectories / Real-Time Data Streams -->
  <path d="M-100 380 C 300 280, 500 480, 850 320 C 1100 200, 1300 360, 1550 260" 
        stroke="url(#streamBlue)" stroke-width="3" fill="none" opacity="0.75"/>

  <path d="M-50 460 C 250 360, 600 520, 950 380 C 1200 280, 1400 420, 1600 340" 
        stroke="url(#streamBlue)" stroke-width="2" stroke-dasharray="8 6" fill="none" opacity="0.6"/>

  <path d="M100 200 C 400 350, 700 180, 1050 300 C 1300 390, 1450 250, 1600 280" 
        stroke="#0c87eb" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Intelligent Queue Nodes (Representing Connected People & Service Desks) -->
  <g filter="url(#glowCyan)">
    <circle cx="320" cy="335" r="7" fill="#38bdf8"/>
    <circle cx="320" cy="335" r="3" fill="#ffffff"/>

    <circle cx="580" cy="445" r="8" fill="#0c87eb"/>
    <circle cx="580" cy="445" r="3.5" fill="#ffffff"/>

    <circle cx="850" cy="320" r="10" fill="#38bdf8"/>
    <circle cx="850" cy="320" r="4" fill="#ffffff"/>

    <circle cx="1080" cy="225" r="7" fill="#026bc9"/>
    <circle cx="1080" cy="225" r="3" fill="#ffffff"/>

    <circle cx="1260" cy="340" r="9" fill="#38bdf8"/>
    <circle cx="1260" cy="340" r="4" fill="#ffffff"/>
  </g>

  <!-- Ambient Light Core -->
  <circle cx="720" cy="260" r="300" fill="#0c87eb" opacity="0.07" filter="url(#glowCyan)"/>
</svg>
